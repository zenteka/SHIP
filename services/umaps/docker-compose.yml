services:
  db:
    image: postgis/postgis:14-3.4-alpine
    restart: always
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust   # DB only on the internal compose network (never published)
    volumes:
      - ${UMAP_DATA}/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: umap/umap:3.8.1
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY}
      SITE_URL: ${SITE_URL}
      DATABASE_URL: postgis://postgres@db/postgres
      REDIS_URL: redis://redis:6379
      REALTIME_ENABLED: 1
      UMAP_ALLOW_ANONYMOUS: 1
      ENABLE_ACCOUNT_LOGIN: 1
      STATIC_ROOT: /srv/umap/static
      MEDIA_ROOT: /srv/umap/uploads
    volumes:
      - ${UMAP_DATA}/uploads:/srv/umap/uploads
      - ${UMAP_DATA}/statics:/srv/umap/static
      - ${UMAP_DATA}/umap.conf:/etc/umap/umap.conf:ro

  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - app
    ports:
      - "8001:80"                         # host 8001 -> nginx; front with Tailscale Serve for HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${UMAP_DATA}/statics:/srv/umap/static:ro
      - ${UMAP_DATA}/uploads:/srv/umap/uploads:ro

  tileserver:
    image: maptiler/tileserver-gl:latest   # FULL image = server-side raster (NOT -light)
    restart: always
    volumes:
      - ${TILES_DATA}:/data:ro
    command: ["--public_url", "${TS_HOST}/tiles/"]
