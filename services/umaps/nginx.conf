server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # Serve collected static files directly (uvicorn/Django won't)
    location /static/ {
        alias /srv/umap/static/;
        access_log off;
        expires 7d;
    }

    # Serve uploaded media directly
    location /uploads/ {
        alias /srv/umap/uploads/;
        access_log off;
    }

    # Self-hosted map tiles (TileServer GL) — same-origin HTTPS so no mixed-content block
    location /tiles/ {
        proxy_pass http://tileserver:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Everything else -> the uMap app (uvicorn on :8000), with WebSocket upgrade for realtime
    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
